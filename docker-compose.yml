
services:
 
  # PostgreSQL database
  sphinx_memory:
    image          : postgres:16-alpine
    container_name : sphinx_memory
    restart        : unless-stopped
 
    environment:
      POSTGRES_USER     : ${POSTGRES_USER:-sphinx}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD:-sphinx_dev_password}
      POSTGRES_DB       : ${POSTGRES_DB:-sphinxeyes}
      PGDATA            : /var/lib/postgresql/data/pgdata
 
    volumes:
      - sphinx_db_data:/var/lib/postgresql/data
 
    ports:
      # Expose only on localhost in dev; remove in production
      - "127.0.0.1:5437:5432"
 
    networks:
      - sphinx_net
 
    healthcheck:
      test     : ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sphinx} -d ${POSTGRES_DB:-sphinxeyes}"]
      interval : 10s
      timeout  : 5s
      retries  : 5
      start_period: 10s
 
  
  # FastAPI backend
  
  sphinx_pyramid:
    build:
      context    : .
      dockerfile : Dockerfile
    container_name : sphinx_pyramid
    restart        : unless-stopped
 
    environment:
      # Pipeline artifacts (paths inside the container)
      ONNX_PATH      : /app/artifacts/best_model_v4.onnx
      CLASS_MAP      : /app/artifacts/class_map50_v4.json
      TRIE_PKL       : /app/artifacts/sphinx_trie_v4.pkl
      BBAW_PARQUET   : /app/artifacts/bbaw_clean.parquet
      CONFUSION_CSV  : /app/artifacts/confusion_matrix_v4_normalized.csv
 
      # Inference parameters
      IMGSZ          : "1024"
      CONF_THRESHOLD : "0.25"
      IOU_THRESHOLD  : "0.45"
      MAX_DETECTIONS : "300"
 
      # Request limits
      MAX_UPLOAD_MB  : "20"
      REQUEST_TIMEOUT: "30.0"
 
      # CORS — adjust forfrontend origin
      CORS_ORIGINS   : '["http://localhost:3000","http://localhost:5173"]'
 
      # Database URL: hostname is the service name on sphinx_net
      DATABASE_URL   : postgresql+asyncpg://${POSTGRES_USER:-sphinx}:${POSTGRES_PASSWORD:-sphinx_dev_password}@sphinx_memory:5432/${POSTGRES_DB:-sphinxeyes}
 
      # OpenAI (Phase 7+)
      OPENAI_API_KEY : ${OPENAI_API_KEY:-}
 
      # Metadata
      PIPELINE_VERSION: v4
 
    volumes:
      # Mount artifacts read-only so model retraining doesn't need rebuild
      - ./artifacts:/app/artifacts:ro
 
    ports:
      - "8000:8000"
 
    networks:
      - sphinx_net
 
    depends_on:
      sphinx_db:
        condition: service_healthy
 
# Networks

networks:
  sphinx_net:
    name   : sphinx_net
    driver : bridge
 

# Volumes
 
volumes:
  sphinx_db_data:
    name: sphinx_db_data